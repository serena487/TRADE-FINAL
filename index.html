<!DOCTYPE html>

<title>무역 기말고사 대비</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a;min-height:100vh}
.app{max-width:720px;margin:0 auto;padding:16px}
.header{background:#fff;border-radius:16px;padding:18px 22px;margin-bottom:14px;border:1px solid #e5e5e5;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}

.panel{display:none}.panel.active{display:block}

.fill1{background:#7c3aed}.fill2{background:#16a34a}.fill3{background:#ea580c}
.prog-text{font-size:12px;color:#999;white-space:nowrap;min-width:46px;text-align:right}
.row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.label-sm{font-size:11px;color:#bbb;letter-spacing:.04em}
.badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}

.opt.sel{border-color:#7c3aed;background:#F5F3FF;color:#6d28d9;font-weight:600}

.fb-ng{background:#FEE2E2;border:1px solid #FECACA;color:#7f1d1d}

textarea:disabled{background:#f9f9f9;color:#555}
.focus-lbl{font-size:13px;color:#555;margin-bottom:11px}
.done-wrap{text-align:center;padding:38px 20px}
.score-big{font-size:44px;font-weight:800;margin-bottom:5px}

.cat-tabs{display:flex;gap:6px;margin-bottom:13px;flex-wrap:wrap}

.cat-tab.on{background:#ea580c;color:#fff;border-color:#ea580c;font-weight:700}

.pool-selected{background:#ede9fe!important;border-color:#7c3aed!important;font-weight:700!important;}

</head>

function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function h(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function switchMain(n){
  document.querySelectorAll('.main-tab').forEach((t,i)=>t.classList.toggle('active',i===n-1));

  if(n===5) renderSetList();
}

  {c:"请准时交货，我方一收到提单副本，即刻付清余款。",k:"제때 물품을 인도해주시기를 바라며, 당사는 선하증권 사본을 수령하자마자 즉시 잔금을 완납하겠습니다.",cat:"구매주문서"},
  {c:"根据我们公司的惯例，凡是新顾客第一次订货时，均需预付百分之三十的订金，但是由于贵公司的名誉一向很好，而且订货的数量也很大，公司很愿意提供这类的优惠。",k:"당사의 관례에 따르면 모든 신규 거래처는 첫 번째 주문 시 30% 계약금을 선지급해야 하지만, 귀사의 평판이 줄곧 좋았고 주문 수량이 많기 때문에 당사는 이러한 우대를 기꺼이 제공하고자 합니다.",cat:"구매주문서"},
  {c:"现附上修改后的销售确认书一份，请查收并签字后将扫描件回传一份，原件请贵司留存。感谢配合。",k:"수정된 판매확인서 한 부를 첨부하오니 확인 수령 및 서명 후 스캔본 한 부를 회신해주시고, 원본은 귀사께서 보관해주십시오. 협조에 감사드립니다.",cat:"구매주문서"},
  {c:"但为了与贵方达成首笔交易，我方决定满足贵方要求。",k:"그러나 귀사와 첫 번째 거래를 달성하기 위해 당사는 귀사의 요구사항을 수용하기로 하였습니다.",cat:"구매주문서"},
  {c:"支付：我方销货确认书签发之日起10天内开立不可撤销，可以分割，转让的信用证，见票即付。",k:"지급: 당사 판매확인서 발행한 날부터 10일 이내에 취소불능·분할·양도 가능한 신용장을 개설하고 일람불 조건으로 지급합니다.",cat:"구매주문서"},
  {c:"期待以此为契机，开启双方的长期合作关系。",k:"이를 계기로 양측의 장기적인 협력관계가 시작될 수 있기를 기대합니다.",cat:"구매주문서"},
  {c:"关于要求我方对第548号定单接受付款交单(D/P)支付方式一节，正如在谈判中我方说过，货款必须以保兑的，不可撤销的，凭即期汇票支付的信用证付款。",k:"당사의 주문서 제548호에 대해 지급인도방식의 D/P지급 방식을 수락할 것을 요구한 조건은 협상 중 당사가 말씀드린 거와 같이 화물대금은 확인된 취소불능의 일람불환어음에 의해 지급되는 신용장으로 결제되어야만 합니다.",cat:"신용장"},
  {c:"因此歉难接受你方此项要求。",k:"따라서 유감스럽지만 귀사의 이 요구사항은 어렵겠습니다.",cat:"신용장"},
  {c:"但鉴于你我双方间的友好关系，我方例外地同意接受60天期的汇票的信用证。",k:"귀사와 당사 양측간의 우호적인 관계를 감안하여 당사는 예외적으로 60일 기한부 환어음에 의한 신용장 수락을 동의합니다.",cat:"신용장"},
  {c:"相信这一特别照顾一定会使你方为我方获得更多的定单。",k:"이 특별한 배려는 귀사로 하여금 당사를 위해 더 많은 주문서를 확보하게 할 수 있을 것이라 믿습니다.",cat:"신용장"},
  {c:"盼候你们的信用证；一俟收到将立即安排装运不误；特此函复。",k:"귀사의 신용장을 기다리고 있습니다; 수령하자마자 선적을 배정하여 차질이 없도록 하겠습니다. 이에 회신드립니다.",cat:"신용장"},
  {c:"审证后，我方发现，贵方不允许分批装运。",k:"신용장을 검토한 후 당사는 귀사가 분할 선적을 허용하지 않는다는 것을 확인하게 되었습니다.",cat:"신용장"},
  {c:"由于最早驶往贵方港口的成功号货轮，舱位已满，所以我方无法将全部货物一次装运交货。",k:"귀사측 항구로 운행하는 가장 이른 화물선 '성공'호가 만선이기 때문에 당사는 전체 화물을 한 번에 선적하여 화물을 인도할 수 없습니다.",cat:"신용장"},
  {c:"由于这是事先没有预料到的，我们特此请求贵方修改信用证，将特别条款不允许分批装运删除或者改成允许分批装运。",k:"이는 사전에 예상하지 못했기 때문에 당사는 신용장을 수정해주시기를 요청 드립니다. 특별조항 '분할선적 불허'를 삭제하시거나 '분할선적 허용'으로 수정해주실 것을 요청 드립니다.",cat:"신용장"},
  {c:"根据中国银行所开具的信用证，我们已经开出以该银行为付款人，见票后30天付款的汇票，金额4,000,000元，望该汇票一经提示，即予承兑。",k:"중국은행에서 개설한 신용장에 근거하여 해당 은행을 지급인으로 하고 일람후 30일 지급 환어음(액면 금액 400만 위안)을 발행했습니다. 해당 환어음이 제시되면 바로 인수 부탁드립니다.",cat:"신용장"},
  {c:"买卖合同签订以后，按照合同规定的时间、地点和方式，将货物运交买方或买方代理人或指定的承运工具，这是卖方承担的首要任务。",k:"매매계약 체결이후 계약서에서 규정한 시간, 장소, 방식에 따라 화물을 매수인, 또는 매수 대리인 또는 매수인이 지정한 운송수단에 인도하는 것이 매도인이 담당하는 가장 중요한 임무입니다.",cat:"선적통지"},
  {c:"货物装载完毕并取得提单后，一般应发出装运通知，以便买方了解装运情况并进行收货前的准备。",k:"화물 선적이 완료되고 선하증권을 취득한 후에 일반적으로 선적통지를 발송함으로써 매수인이 선적상황을 파악하고 화물 수령 전의 준비를 진행할 수 있도록 한다.",cat:"선적통지"},
  {c:"这类书信通常还附寄有关文件，以便买方提货。",k:"선적 통지 서신은 매수인이 화물을 인수할 수 있도록 보통 관련 서류를 첨부한다.",cat:"선적통지"},
  {c:"买方收到信后应尽快将提货情况通知卖方，并完成付款手续。",k:"매수인은 서신을 수령한 후에 화물을 인수받은 상황을 최대한 빨리 매도인에게 통지하고 지급 수속을 청산해야 한다.",cat:"선적통지"},
  {c:"我方迟迟通知的原因是从此地驶往你方港口的直达船十分稀少，殊难租到舱位。",k:"당사가 늦게 통지한 이유는 여기에서 귀측 항구로 운행하는 직항 노선이 매우 드물어 선복을 확보하기 매우 어렵기 때문입니다.",cat:"선적통지"},
  {c:"一俟舱位订妥，当以电邮通知贵方确切装运日期。",k:"선복이 확보되면 즉시 귀사에게 메일로 확실한 선적 일자를 통지하겠습니다.",cat:"선적통지"},
  // ── 추가: 카운터오퍼 ──
  {c:"还盘是对原发盘的拒绝，新受盘人有权针对还盘的内容作出接受，拒绝或再还盘，直到最终接受为止。",k:"반대청약은 원청약에 대한 거절입니다. 새로운 피청약자는 최종 합의가 있을 때까지 반대청약의 내용에 대해 승낙, 거절, 재반대청약을 할 권리가 있습니다.",cat:"카운터오퍼"},
  {c:"最后应以客气礼貌的请早日惠知、盼复等语句结束，并表明希望今后仍能有合作的机会。",k:"마지막에는 '조속히 알려주시기 바랍니다', '회신을 기다립니다'와 같은 공손하고 예의 바른 문구로 끝을 맺고, 앞으로도 계속 협력할 수 있기를 바란다는 뜻을 밝혀야 한다.",cat:"카운터오퍼"},
  // ── 추가: 구매주문서 ──
  {c:"或者卖方虽然接受了采购订单，但不能发货，责任如何分配等，都可以在采购订单上同时说明。",k:"또는 매도인이 구매주문서를 승낙했지만 화물을 발송할 수 없다면 책임을 어떻게 분배할지 등을 모두 구매주문서에 동시에 설명할 수 있다.",cat:"구매주문서"},
  {c:"对任何凭买方样或对等样买卖，我们通常都规定定量。",k:"매수인 견본에 따른 매매 혹은 반대 견본에 따른 매매, 어떠한 매매에서라도 당사는 보통 일정량을 정하고 있습니다.",cat:"구매주문서"},
  {c:"你方3月7日关于要求将最低订货量降为100打的来信收悉。",k:"최저 주문량을 100다스로 조정을 요구한 귀사의 3월 7일자 서신을 잘 받았습니다.",cat:"구매주문서"},
  {c:"我现在写这封信的目的是确认贵公司采购订单A123号的预付定金，经我们双方同意由百分之三十减为百分之二十。",k:"이 서신을 드리는 것은 귀사의 구매주문서 A123호의 선지급 계약금을 양 당사의 동의 하에 30%에서 20%로 조정한 것을 확인하기 위해서입니다.",cat:"구매주문서"},
  {c:"告知对方货物即将发出，希望对方查收。",k:"상대방에게 화물이 곧 발송될 것임을 알리고, 상대방이 확인 후 수령하기를 바란다고 고지한다.",cat:"구매주문서"},
  {c:"简单扼要地询问顾客是否还有其他要求，并写明希望今后收到更多的订单。",k:"간단하면서도 핵심을 분명히 하여 거래처에 기타 요구사항이 더 있는지 여부를 문의하고, 앞으로 더 많은 주문을 받기를 희망한다고 명시한다.",cat:"구매주문서"},
  {c:"谢谢订购本公司LXT1000最新型袖珍电脑二百五十台。",k:"당사의 최신형 초소형 컴퓨터 LXT1000 250대를 주문해주셔서 감사합니다.",cat:"구매주문서"},

let s1={order:[],idx:0,blanks:{},activeBlank:null,conf:false,score:0,scoreTotal:0,done:false,shuffledPool:[]};

function initType1(){
  s1.order=shuf(Q1.map(function(_,i){return i;}));
  s1.idx=0;s1.blanks={};s1.activeBlank=null;s1.conf=false;s1.score=0;s1.scoreTotal=0;s1.done=false;
  s1.shuffledPool=shuf((Q1[s1.order[0]].pool||Q1[s1.order[0]].o).slice());
  renderType1();
}

function renderType1(){
  var el=document.getElementById('panel1');
  if(s1.done){
    var p=Math.round(s1.score/s1.scoreTotal*100);
    var c2=p>=90?'완벽해요! 🎉':p>=70?'잘 하고 있어요 👍':p>=50?'조금 더 연습해봐요 💪':'다시 복습해봐요 📖';
    var wn=wrongNotes.t1.length;
    el.innerHTML='<div class="card done-wrap">'
      +'<div class="score-big" style="color:'+(p>=70?'#16a34a':'#dc2626')+'">'+s1.score+' / '+s1.scoreTotal+'</div>'
      +'<div class="score-lbl">'+p+'점 · '+c2+'</div>'
      +(wn?'<div style="margin-bottom:16px;font-size:13px;color:#dc2626">오답 '+wn+'개가 오답노트에 저장됐어요.</div>':'')
      +'<div class="btn-row" style="justify-content:center;flex-wrap:wrap">'
      +'<button class="btn btn-p" onclick="initType1()">처음부터</button>'
      +'<button class="btn btn-ghost" onclick="restartT1Shuf()">랜덤으로 다시</button>'
      +(wn?'<button class="btn btn-ghost" style="border-color:#fca5a5;color:#dc2626" onclick="switchMain(4)">오답노트 보기 ('+wn+')</button>':'')
      +'</div></div>';
    return;
  }

  var q=Q1[s1.order[s1.idx]];
  var pct=Math.round((s1.idx+1)/Q1.length*100);
  var parts=q.a_parts || [q.a]; // 빈칸별 정답 파트
  var blanks=q.s.split('___').length-1;
  var pool=s1.shuffledPool || shuf(q.pool||q.o);

  // 문장 렌더 - 빈칸마다 독립 상태
  var sParts=q.s.split('___');
  var sentHtml='';
  sParts.forEach(function(part,pi){
    sentHtml+='<span>'+h(part)+'</span>';
    if(pi<sParts.length-1){
      var selVal=s1.blanks[pi]||'';
      var isActive=!s1.conf && s1.activeBlank===pi;
      var isCorrect=s1.conf?(selVal===parts[pi]):null;
      var bStyle='display:inline-block;min-width:72px;padding:3px 10px;border-radius:8px;font-weight:700;font-size:13px;vertical-align:middle;';
      if(s1.conf){
        bStyle+=isCorrect
          ?'border:2px solid #16a34a;color:#15803d;background:#f0fdf4;cursor:default;'
          :'border:2px solid #dc2626;color:#dc2626;background:#fef2f2;cursor:default;';
      } else if(isActive){
        bStyle+='border:2px solid #7c3aed;color:#5b21b6;background:#ede9fe;cursor:pointer;box-shadow:0 0 0 3px #f0ebff;';
      } else if(selVal){
        bStyle+='border:2px solid #7c3aed;color:#5b21b6;background:#f5f3ff;cursor:pointer;';
      } else {
        bStyle+='border:2px dashed #ccc;color:#bbb;background:#fafafa;cursor:pointer;';
      }
      var clickFn=s1.conf?'':'onclick="t1ActivateBlank('+pi+')"';
      sentHtml+='<span '+clickFn+' style="'+bStyle+'">'+(selVal||'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;')+'</span>';
    }
  });

  // 보기 풀 - 빈칸 활성화 시 강조
  var poolHtml='';
  pool.forEach(function(opt){
    var isUsed=Object.values(s1.blanks).indexOf(opt)!==-1;
    var isActive=s1.activeBlank!==null;
    var isSel=isUsed;
    var style='padding:6px 13px;border-radius:16px;font-size:13px;border:1.5px solid;cursor:pointer;display:inline-block;';
    if(isSel&&!isActive){
      style+='border-color:#c4b8fa;color:#a78bfa;background:#f5f3ff;opacity:0.55;';
    } else if(isActive){
      style+='border-color:#7c3aed;background:#fff;color:#5b21b6;font-weight:600;';
    } else {
      style+='border-color:#c4b8fa;background:#fff;color:#555;';
    }
    var clickFn=isActive?'onclick="t1PickOpt(\''+h(opt)+'\')\"':'onclick="s1.activeBlank=null;renderType1()"';
    poolHtml+='<span '+clickFn+' style="'+style+'">'+h(opt)+'</span>';
  });

  // 정오답 피드백
  var fbHtml='';
  if(s1.conf){
    var allOk=parts.every(function(p,pi){return s1.blanks[pi]===p;});
    fbHtml='<div class="fb '+(allOk?'fb-ok':'fb-ng')+'">'+(allOk?'✓ 정답입니다!':'✗ 오답&nbsp;&nbsp;정답: <strong>'+h(q.a)+'</strong>')+'</div>';
  }

  // 활성 안내
  var guideHtml='';
  if(s1.activeBlank!==null&&!s1.conf){
    guideHtml='<div style="font-size:12px;color:#7c3aed;font-weight:600;margin-top:6px">↑ 위 보기에서 선택하세요 &nbsp;·&nbsp; <span onclick="s1.activeBlank=null;renderType1()" style="cursor:pointer;text-decoration:underline;color:#999">취소</span></div>';
  }

  var filledBlanks=Object.keys(s1.blanks).length;
  var allFilled=filledBlanks===blanks;

  var wBadge=wrongNotes.t1.length?'<span style="font-size:11px;color:#dc2626;margin-left:6px">오답노트 '+wrongNotes.t1.length+'</span>':'';

  el.innerHTML=''
    +'<div class="prog-row">'
    +'<div class="prog-bar"><div class="prog-fill fill1" style="width:'+pct+'%"></div></div>'
    +'<span class="prog-text">'+(s1.idx+1)+' / '+Q1.length+'</span>'
    +'</div>'
    +'<div class="card">'
    +'<div class="lbl"><span class="label-sm">빈칸에 알맞은 용어를 보기에서 고르시오</span><span class="badge b1">'+h(q.cat)+'</span></div>'
    // 보기 풀
    +'<div style="margin-bottom:6px;font-size:12px;color:#888;font-weight:600">〔보기〕'+(s1.activeBlank!==null&&!s1.conf?' — 선택하세요':'')+'</div>'
    +'<div style="display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:#f8f7ff;border-radius:10px;border:1px solid #e8e4ff;margin-bottom:12px">'+poolHtml+'</div>'
    +guideHtml
    // 문장
    +'<div style="font-size:15px;line-height:2.6;padding:10px;background:#FAFAF8;border:1px solid #e5e5e5;border-radius:8px;margin-top:8px;word-break:keep-all">'+sentHtml+'</div>'
    +fbHtml
    +'<div class="btn-row">'
    +(!s1.conf
      ?'<button class="btn btn-p" onclick="confType1()" style="opacity:'+(allFilled?'1':'0.35')+'">정답 확인</button>'
      :'<button class="btn btn-b" onclick="nextType1()">'+(s1.idx+1>=Q1.length?'결과 보기 →':'다음 문제 →')+'</button>')
    +'<button class="btn btn-ghost" style="margin-left:auto" onclick="restartT1Shuf()">랜덤 섞기</button>'
    +(wrongNotes.t1.length?'<button class="btn btn-ghost" style="font-size:12px;border-color:#fca5a5;color:#dc2626" onclick="switchMain(4)">오답노트('+wrongNotes.t1.length+')</button>':'')
    +'</div>'
    +'</div>';
}

function t1ActivateBlank(pi){
  s1.activeBlank = s1.activeBlank===pi ? null : pi;
  renderType1();
}

function t1PickOpt(raw){
  if(s1.activeBlank===null) return;
  var pi=s1.activeBlank;
  if(s1.blanks[pi]===raw){
    delete s1.blanks[pi];
  } else {
    // 이미 다른 빈칸에 배정돼있으면 해제
    Object.keys(s1.blanks).forEach(function(k){
      if(s1.blanks[k]===raw) delete s1.blanks[k];
    });
    s1.blanks[pi]=raw;
  }
  s1.activeBlank=null;
  renderType1();
}
function pickOpt1(oi){
  if(s1.conf)return;
  s1.sel=s1.opts[parseInt(oi)];
  renderType1();
}
function confType1(){
  if(s1.conf)return;
  var q=Q1[s1.order[s1.idx]];
  var parts=q.a_parts||[q.a];
  var blanks=q.s.split('___').length-1;
  if(Object.keys(s1.blanks).length<blanks)return;
  s1.conf=true;
  var correct=true;
  parts.forEach(function(p,pi){
    s1.scoreTotal++;
    if(s1.blanks[pi]===p){ s1.score++; } else { correct=false; }
  });
  if(!correct) addWrong('t1',q);
  renderType1();
}
function nextType1(){
  s1.idx++;
  if(s1.idx>=Q1.length){s1.done=true;renderType1();return;}
  s1.blanks={};s1.activeBlank=null;s1.conf=false;
  s1.shuffledPool=shuf((Q1[s1.order[s1.idx]].pool||Q1[s1.order[s1.idx]].o).slice());
  renderType1();
}
function restartT1Shuf(){
  s1.order=shuf(Q1.map(function(_,i){return i;}));
  s1.idx=0;s1.blanks={};s1.activeBlank=null;s1.conf=false;s1.score=0;s1.scoreTotal=0;s1.done=false;
  s1.shuffledPool=shuf((Q1[s1.order[0]].pool||Q1[s1.order[0]].o).slice());
  renderType1();
}

  el.innerHTML=`
    <div class="prog-row">
      <div class="prog-bar"><div class="prog-fill fill2" style="width:${pct}%"></div></div>
      <span class="prog-text">${s2.idx+1} / ${Q2.length}</span>
    </div>
    <div class="card">
      <div class="row-top">
        <span class="label-sm">문맥에 맞게 밑줄 친 표현을 해석하시오</span>

      </div>

const CATS3=['전체',...[...new Set(Q3.map(q=>q.cat))]];
let s3={cat:'전체',order:[],idx:0,input:'',shown:false,done:false};

function initType3(){
  s3.cat='전체';
  s3.order=shuf(Q3.map((_,i)=>i));
  s3.idx=0;s3.input='';s3.shown=false;s3.done=false;
  renderType3();
}

function changeCat3(c){
  s3.cat=c;
  const idxs=Q3.map((_,i)=>i).filter(i=>c==='전체'||Q3[i].cat===c);
  s3.order=shuf(idxs);s3.idx=0;s3.input='';s3.shown=false;s3.done=false;
  renderType3();
}

function renderType3(){
  const el=document.getElementById('panel3');

    el.innerHTML=`<div class="cat-tabs">${catTabsHtml}</div>
    <div class="card done-wrap">
      <div class="score-big" style="color:#ea580c">${s3.order.length} 완료 🎉</div>

      </div></div>`;
    return;
  }
  const total=s3.order.length;
  const q=Q3[s3.order[s3.idx]];
  const pct=Math.round((s3.idx+1)/total*100);
  const fb=s3.shown?`<div class="fb fb-info"><span style="font-weight:700">모범 번역</span><br>${h(q.k)}</div>`:'';
  const btnCheck=!s3.shown?`<button class="btn btn-o" onclick="checkType3()">정답 확인</button>`:'';
  const btnNext=s3.shown?`<button class="btn btn-b" onclick="nextType3()">${s3.idx+1>=total?'결과 보기 →':'다음 문제 →'}</button>`:'';
  el.innerHTML=`
    <div class="cat-tabs">${catTabsHtml}</div>
    <div class="prog-row">
      <div class="prog-bar"><div class="prog-fill fill3" style="width:${pct}%"></div></div>
      <span class="prog-text">${s3.idx+1} / ${total}</span>
    </div>
    <div class="card">
      <div class="row-top">
        <span class="label-sm">중국어 문장을 한국어로 해석하시오</span>
        <span class="badge b3">${h(q.cat)}</span>
      </div>
      <div class="sbox sb3">${h(q.c)}</div>
      <textarea id="ta3" ${s3.shown?'disabled':''} placeholder="한국어로 해석을 적어주세요...">${h(s3.input)}</textarea>
      ${fb}

        ${btnCheck}${btnNext}
        ${s3.shown?`<button class="btn btn-ghost" style="font-size:12px;color:#dc2626;border-color:#fca5a5" onclick="addWrong('t3',Q3[s3.order[s3.idx]]);renderType3()">오답노트 추가</button>`:''}

    </div>`;
  const ta=document.getElementById('ta3');
  if(ta&&!s3.shown)ta.oninput=e=>{s3.input=e.target.value;};

   오답노트 전역 저장소
══════════════════════════════════════ */
const wrongNotes = { t1:[], t2:[], t3:[] };

function addWrong(type, q) {
  const store = wrongNotes[type];
  const key = type==='t1' ? q.s : type==='t2' ? q.s+q.f : q.c;
  if (!store.find(x => (type==='t1'?x.s:type==='t2'?x.s+x.f:x.c) === key)) store.push(q);
}

/* ══════════════════════════════════════
   오답노트 탭 렌더
══════════════════════════════════════ */
function renderWrong() {
  const el = document.getElementById('panel4');
  const t1 = wrongNotes.t1, t2 = wrongNotes.t2, t3 = wrongNotes.t3;
  const total = t1.length + t2.length + t3.length;
  if (total === 0) {
    el.innerHTML = `<div class="card done-wrap" style="padding:40px 20px">
      <div style="font-size:36px;margin-bottom:10px">🎉</div>

    </div>`;
    return;
  }

  let html = `<div style="font-size:13px;color:#999;margin-bottom:12px">총 ${total}개의 오답이 저장되어 있어요.</div>`;

  if (t1.length) {
    html += `<div class="card" style="margin-bottom:10px">
      <div class="row-top" style="margin-bottom:12px">
        <span style="font-weight:700;font-size:14px">유형 1 · 빈칸 채우기</span>
        <span class="badge b1">${t1.length}개</span>
      </div>`;
    t1.forEach((q,i) => {
      const blanked = q.s.replace('___', `<span style="border-bottom:2px solid #7c3aed;color:#7c3aed;font-weight:700;padding:0 6px">${h(q.a)}</span>`);
      html += `<div style="padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:14px;line-height:1.8">
        <div style="color:#888;font-size:11px;margin-bottom:4px">${h(q.cat)}</div>
        <div>${blanked}</div>
        <div style="font-size:13px;color:#7c3aed;margin-top:3px">정답: ${h(q.a)}</div>
      </div>`;
    });
    html += `<button class="btn btn-ghost" style="margin-top:12px;font-size:12px" onclick="wrongNotes.t1=[];renderWrong()">유형1 오답 초기화</button></div>`;
  }

  if (t2.length) {
    html += `<div class="card" style="margin-bottom:10px">
      <div class="row-top" style="margin-bottom:12px">
        <span style="font-weight:700;font-size:14px">유형 2 · 표현 해석</span>
        <span class="badge b2">${t2.length}개</span>
      </div>`;
    t2.forEach(q => {
      const clean = q.f.replace('～','');
      const hi = q.s.includes(clean) ? q.s.replace(clean,`<u style="font-weight:700;color:#15803d">${h(clean)}</u>`) : h(q.s);
      html += `<div style="padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:14px;line-height:1.8">
        <div style="color:#888;font-size:11px;margin-bottom:4px">${h(q.cat)}</div>
        <div style="background:#F0FDF4;padding:8px 10px;border-radius:8px;margin-bottom:5px">${hi}</div>
        <div style="font-size:13px;color:#15803d">「${h(q.f)}」→ ${h(q.a)}</div>
        <div style="font-size:12px;color:#888;margin-top:2px">${h(q.e)}</div>
      </div>`;
    });
    html += `<button class="btn btn-ghost" style="margin-top:12px;font-size:12px" onclick="wrongNotes.t2=[];renderWrong()">유형2 오답 초기화</button></div>`;
  }

  if (t3.length) {
    html += `<div class="card" style="margin-bottom:10px">
      <div class="row-top" style="margin-bottom:12px">
        <span style="font-weight:700;font-size:14px">유형 3 · 문장 해석</span>
        <span class="badge b3">${t3.length}개</span>
      </div>`;
    t3.forEach(q => {
      html += `<div style="padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:14px;line-height:1.8">
        <div style="color:#888;font-size:11px;margin-bottom:4px">${h(q.cat)}</div>
        <div style="background:#FFF7ED;padding:8px 10px;border-radius:8px;letter-spacing:.03em;margin-bottom:5px">${h(q.c)}</div>
        <div style="font-size:13px;color:#ea580c">${h(q.k)}</div>
      </div>`;
    });
    html += `<button class="btn btn-ghost" style="margin-top:12px;font-size:12px" onclick="wrongNotes.t3=[];renderWrong()">유형3 오답 초기화</button></div>`;
  }

  html += `<div style="text-align:center;margin-top:4px">
    <button class="btn btn-ghost" style="font-size:12px;color:#dc2626;border-color:#fca5a5" onclick="wrongNotes.t1=[];wrongNotes.t2=[];wrongNotes.t3=[];renderWrong()">전체 오답 초기화</button>
  </div>`;
  el.innerHTML = html;
}

/* 보기 표시용 헬퍼 - mode에 따라 한글만/중문만 반환 */
function displayOpt(raw, mode) {
  if (mode === 'ko') {
    return raw.replace(/\(([^)]*[\u4e00-\u9fff][^)]*)\)/g, '').replace(/\s+/g, ' ').trim();
  } else {
    var parts = raw.split(' / ');
    var result = parts.map(function(p) {
      var m = p.match(/\(([^)]*[\u4e00-\u9fff][^)]*)\)/);
      if (m) return m[1];
      if (/[\u4e00-\u9fff]/.test(p) && !/[\uAC00-\uD7A3]/.test(p)) return p.trim();
      return p.replace(/\(([^)]*[\u4e00-\u9fff][^)]*)\)/g,'').trim();
    });
    return result.join(' / ');
  }
}

/* 세트 퀴즈 화면 */
function renderSetQuiz(){
  var el=document.getElementById('panel-set');
  var set=SETS[sm.setIdx];
  var mode=set.mode;
  var totalBlanks=0;
  set.qs.forEach(function(q){ totalBlanks+=q.s.split('___').length-1; });
  var filledBlanks=Object.keys(sm.answers).length;

  var modeBadge=mode==='cn'
    ? '<span style="font-size:11px;padding:2px 7px;border-radius:10px;background:#FEF3C7;color:#92400e;font-weight:700;margin-left:8px">중문 보기</span>'
    : '<span style="font-size:11px;padding:2px 7px;border-radius:10px;background:#EDE9FE;color:#5b21b6;font-weight:700;margin-left:8px">한글 보기</span>';

  var html='';
  // 헤더
  html+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">';
  html+='<button class="btn btn-ghost" style="font-size:12px;padding:6px 12px" onclick="renderSetList()">← 목록</button>';
  html+='<span style="font-size:12px;color:#999">'+(sm.setIdx+1)+' / '+SETS.length+' 세트</span>';
  html+='</div>';

  // 제목 + 보기 풀 (상단 고정)
  html+='<div class="card" style="margin-bottom:10px;padding:14px 16px">';
  html+='<div style="display:flex;align-items:center;margin-bottom:8px">';
  html+='<span style="font-weight:700;font-size:15px">'+h(set.title)+'</span>'+modeBadge;
  html+='</div>';

  // 보기 단어들
  if(!sm.submitted){
    html+='<div style="font-size:12px;color:#888;font-weight:600;margin-bottom:6px">〔보기〕 빈칸을 클릭하면 선택할 수 있어요</div>';
    html+='<div style="display:flex;flex-wrap:wrap;gap:6px">';
    shufArr(set.pool.slice()).forEach(function(opt){
      var disp=displayOpt(opt,mode);
      var usedKey=null;
      Object.keys(sm.answers).forEach(function(k){ if(sm.answers[k]===opt) usedKey=k; });
      var isActive=sm.activeBlank!==null; // 빈칸 선택 중인지
      var isUsed=usedKey!==null;
      var isSelectedForActive=isActive && sm.answers[sm.activeBlank]===opt;

      var style='padding:6px 13px;border-radius:16px;font-size:13px;border:1.5px solid;cursor:pointer;';
      if(isUsed && !isActive){
        style+='border-color:#d0c4f7;color:#a78bfa;background:#f5f3ff;opacity:0.6;';
      } else if(isSelectedForActive){
        style+='border-color:#7c3aed;background:#ede9fe;color:#5b21b6;font-weight:700;';
      } else if(isActive){
        style+='border-color:#7c3aed;background:#fff;color:#5b21b6;font-weight:600;';
      } else {
        style+='border-color:#c4b8fa;background:#fff;color:#555;';
      }

      var clickFn=isActive?'onclick="pickOpt(\''+h(opt)+'\')\"':'onclick="sm.activeBlank=null;renderSetQuiz()"';
      html+='<span '+clickFn+' style="'+style+'">'+h(disp)+'</span>';
    });
    html+='</div>';

    // 활성 빈칸 안내
    if(sm.activeBlank!==null){
      html+='<div style="margin-top:8px;font-size:12px;color:#7c3aed;font-weight:600">↑ 위 보기에서 선택하세요 &nbsp;·&nbsp; <span onclick="sm.activeBlank=null;renderSetQuiz()" style="cursor:pointer;text-decoration:underline;color:#999">취소</span></div>';
    }
  }
  html+='</div>';

  // 문제 목록
  html+='<div style="display:flex;flex-direction:column;gap:8px">';
  set.qs.forEach(function(q,qi){
    var ansParts=q.a.split(' / ');
    var blanks=q.s.split('___').length-1;
    var ansDisplay=displayOpt(q.a,mode);

    // 정오답
    var qCorrect=null;
    if(sm.submitted){
      qCorrect=true;
      for(var pi2=0;pi2<blanks;pi2++){
        var cp2=ansParts.length>1&&ansParts[pi2]!==undefined?ansParts[pi2]:q.a;
        if((sm.answers[qi+'_'+pi2]||'')!==cp2){qCorrect=false;break;}
      }
    }
    var feedbackBadge='';
    if(sm.submitted){
      feedbackBadge=qCorrect
        ? '<div style="font-size:12px;color:#15803d;font-weight:700;margin-top:4px;padding:3px 8px;background:#f0fdf4;border-radius:6px;display:inline-block">✓ 정답</div>'
        : '<div style="font-size:12px;color:#dc2626;margin-top:4px;padding:4px 10px;background:#fef2f2;border-radius:6px">✗ 정답: <strong>'+h(ansDisplay)+'</strong></div>';
    }

    // 문장 파트
    var parts=q.s.split('___');
    var sentHtml='';
    parts.forEach(function(part,pi){
      sentHtml+='<span>'+h(part)+'</span>';
      if(pi<parts.length-1){
        var key=qi+'_'+pi;
        var selVal=sm.answers[key]||'';
        var selDisp=selVal?displayOpt(selVal,mode):'';
        var isActive=!sm.submitted&&sm.activeBlank===key;
        var correctPart=ansParts.length>1&&ansParts[pi]!==undefined?ansParts[pi]:q.a;
        var isThisCorrect=sm.submitted?(selVal===correctPart):null;

        var bStyle='display:inline-block;min-width:72px;padding:3px 10px;border-radius:8px;'
          +'font-weight:700;font-size:13px;vertical-align:middle;transition:all .15s;';

        if(sm.submitted){
          bStyle+=isThisCorrect
            ?'border:2px solid #16a34a;color:#15803d;background:#f0fdf4;cursor:default;'
            :'border:2px solid #dc2626;color:#dc2626;background:#fef2f2;cursor:default;';
        } else if(isActive){
          bStyle+='border:2px solid #7c3aed;color:#5b21b6;background:#ede9fe;cursor:pointer;box-shadow:0 0 0 3px #ede9fe;';
        } else if(selVal){
          bStyle+='border:2px solid #7c3aed;color:#5b21b6;background:#f5f3ff;cursor:pointer;';
        } else {
          bStyle+='border:2px dashed #ccc;color:#bbb;background:#fafafa;cursor:pointer;';
        }

        var clickFn=sm.submitted?'':'onclick="activateBlank(\''+key+'\')"';
        sentHtml+='<span '+clickFn+' style="'+bStyle+'">'+(selDisp||'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;')+'</span>';
      }
    });

    html+='<div class="card" style="padding:12px 14px">';
    html+='<div style="display:flex;align-items:flex-start;gap:8px">';
    html+='<span style="font-size:12px;color:#7c3aed;font-weight:700;min-width:18px;padding-top:5px">'+(qi+1)+'.</span>';
    html+='<div style="font-size:14px;line-height:2.4;flex:1;word-break:keep-all">'+sentHtml+'</div>';
    html+='</div>';
    if(feedbackBadge) html+='<div style="padding-left:26px">'+feedbackBadge+'</div>';
    html+='</div>';
  });
  html+='</div>';

  // 하단 버튼
  if(!sm.submitted){
    var allDone=filledBlanks===totalBlanks;
    html+='<div class="btn-row" style="margin-top:14px;justify-content:center">';
    html+='<button class="btn btn-p submit-btn" onclick="submitSet()" style="opacity:'+(allDone?'1':'0.4')+'">채점하기 ('+filledBlanks+'/'+totalBlanks+')</button>';
    html+='<button class="btn btn-ghost" onclick="resetSet()">초기화</button>';
    html+='</div>';
  } else {
    var pct2=Math.round(sm.score/sm.scoreTotal*100);
    var cm=pct2===100?'만점! 🎉':pct2>=80?'잘 했어요 👍':pct2>=60?'조금 더 연습해봐요 💪':'다시 풀어봐요 📖';
    html+='<div class="card" style="text-align:center;padding:20px;margin-top:12px;background:#f8f7ff;border-color:#e8e4ff">';
    html+='<div style="font-size:32px;font-weight:800;color:'+(pct2>=70?'#16a34a':'#dc2626')+';margin-bottom:4px">'+sm.score+' / '+sm.scoreTotal+'</div>';
    html+='<div style="font-size:13px;color:#666;margin-bottom:14px">'+pct2+'점 · '+cm+'</div>';
    html+='<div class="btn-row" style="justify-content:center;flex-wrap:wrap">';
    html+='<button class="btn btn-p" onclick="startSet('+sm.setIdx+')">다시 풀기</button>';
    if(sm.setIdx<SETS.length-1) html+='<button class="btn btn-b" onclick="startSet('+(sm.setIdx+1)+')">다음 세트 →</button>';
    html+='<button class="btn btn-ghost" onclick="renderSetList()">목록으로</button>';
    html+='</div></div>';
  }

  el.innerHTML=html;
}

// 빈칸 활성화 - 이미 활성이면 닫기
function activateBlank(key){
  sm.activeBlank = sm.activeBlank===key ? null : key;
  renderSetQuiz();
}

// 보기에서 선택 → 활성 빈칸에 배정
function pickOpt(raw){
  if(sm.activeBlank===null) return;
  var key=sm.activeBlank;
  // 이미 같은 답이면 취소
  if(sm.answers[key]===raw){
    delete sm.answers[key];
  } else {
    // 이 답이 다른 빈칸에 배정돼 있으면 그 빈칸도 해제
    Object.keys(sm.answers).forEach(function(k){
      if(sm.answers[k]===raw && k!==key) delete sm.answers[k];
    });
    sm.answers[key]=raw;
  }
  sm.activeBlank=null;
  renderSetQuiz();
}

// 채점
function submitSet(){
  var set=SETS[sm.setIdx];
  sm.submitted=true;
  sm.score=0;
  sm.scoreTotal=0;
  sm.activeBlank=null;
  set.qs.forEach(function(q,qi){
    var blanks=q.s.split('___').length-1;
    var ansParts=q.a.split(' / ');
    var qCorrect=true;
    for(var pi=0;pi<blanks;pi++){
      sm.scoreTotal++;
      var key=qi+'_'+pi;
      var selVal=sm.answers[key]||'';
      var correctPart=ansParts.length>1&&ansParts[pi]!==undefined?ansParts[pi]:q.a;
      if(selVal===correctPart){ sm.score++; } else { qCorrect=false; }
    }
    if(!qCorrect) addWrong('t1',{cat:set.title,s:q.s,a:q.a,o:[q.a]});
  });
  renderSetQuiz();
}

// 초기화
function resetSet(){
  sm.answers={};
  sm.activeBlank=null;
  renderSetQuiz();
}

  initType1();
  initType2();

  renderSetList();
});
