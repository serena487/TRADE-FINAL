<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무역 기말고사 대비</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a;min-height:100vh}
.app{max-width:720px;margin:0 auto;padding:16px}
.header{background:#fff;border-radius:16px;padding:18px 22px;margin-bottom:14px;border:1px solid #e5e5e5;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.header-title{font-size:19px;font-weight:700}
.header-sub{font-size:12px;color:#999;margin-top:2px}
.main-tabs{display:flex;gap:6px;margin-bottom:14px;background:#fff;border-radius:14px;padding:6px;border:1px solid #e5e5e5}
.main-tab{flex:1;padding:10px 6px;border:none;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;background:none;color:#999;transition:all .2s;line-height:1.4}
.main-tab.active{background:#1a1a1a;color:#fff}
.panel{display:none}.panel.active{display:block}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:18px;margin-bottom:12px}
.prog-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.prog-bar{flex:1;height:6px;background:#ebebeb;border-radius:3px}
.prog-fill{height:100%;border-radius:3px;transition:width .3s}
.fill1{background:#7c3aed}.fill2{background:#16a34a}.fill3{background:#ea580c}
.prog-text{font-size:12px;color:#999;white-space:nowrap;min-width:46px;text-align:right}
.row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.label-sm{font-size:11px;color:#bbb;letter-spacing:.04em}
.badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.b1{background:#EDE9FE;color:#6d28d9}.b2{background:#DCFCE7;color:#15803d}.b3{background:#FFEDD5;color:#c2410c}
.sbox{font-size:15px;line-height:2.1;padding:13px 15px;border-radius:10px;margin-bottom:13px;word-break:keep-all}
.sb1{background:#FAFAF8;border:1px solid #e5e5e5}.sb2{background:#F0FDF4;border:1px solid #BBF7D0;color:#14532d}
.sb3{background:#FFF7ED;border:1px solid #FED7AA;color:#7c2d12;font-size:16px;letter-spacing:.03em;line-height:1.9}
.blank{display:inline-block;min-width:88px;border-bottom:2px solid #7c3aed;color:#7c3aed;font-weight:700;text-align:center;padding:0 5px}
.opts-label{font-size:12px;color:#aaa;margin-bottom:7px}
.opts{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:3px}
.opt{padding:7px 13px;border:1.5px solid #ddd;border-radius:20px;background:#fff;cursor:pointer;font-size:13px;color:#333;transition:all .15s}
.opt:hover{border-color:#7c3aed;background:#F5F3FF}
.opt.sel{border-color:#7c3aed;background:#F5F3FF;color:#6d28d9;font-weight:600}
.opt.ok{border-color:#16a34a;background:#DCFCE7;color:#15803d;font-weight:700;pointer-events:none}
.opt.ng{border-color:#dc2626;background:#FEE2E2;color:#b91c1c;font-weight:700;pointer-events:none}
.opt.dim{pointer-events:none;opacity:.5}
.fb{border-radius:10px;padding:11px 14px;font-size:14px;line-height:1.7;margin-top:11px}
.fb-ok{background:#DCFCE7;border:1px solid #BBF7D0;color:#14532d}
.fb-ng{background:#FEE2E2;border:1px solid #FECACA;color:#7f1d1d}
.fb-info{background:#EFF6FF;border:1px solid #BFDBFE;color:#1e3a5f}
.btn-row{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap;align-items:center}
.btn{padding:10px 20px;border:none;border-radius:10px;cursor:pointer;font-size:14px;font-weight:700}
.btn-p{background:#7c3aed;color:#fff}.btn-g{background:#16a34a;color:#fff}
.btn-o{background:#ea580c;color:#fff}.btn-b{background:#1d4ed8;color:#fff}
.btn-ghost{background:#fff;border:1.5px solid #ddd;color:#555;font-weight:500}
textarea{width:100%;padding:10px 12px;border:1.5px solid #ddd;border-radius:10px;font-size:14px;line-height:1.7;resize:vertical;font-family:inherit;min-height:78px;color:#1a1a1a}
textarea:focus{outline:none;border-color:#aaa}
textarea:disabled{background:#f9f9f9;color:#555}
.focus-lbl{font-size:13px;color:#555;margin-bottom:11px}
.done-wrap{text-align:center;padding:38px 20px}
.score-big{font-size:44px;font-weight:800;margin-bottom:5px}
.score-lbl{font-size:15px;color:#666;margin-bottom:22px}
.cat-tabs{display:flex;gap:6px;margin-bottom:13px;flex-wrap:wrap}
.cat-tab{padding:5px 12px;font-size:12px;border-radius:16px;border:1px solid #ddd;background:#fff;cursor:pointer;color:#666;font-weight:500}
.cat-tab.on{background:#ea580c;color:#fff;border-color:#ea580c;font-weight:700}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <div class="header-title">무역 기말고사 대비</div>
      <div class="header-sub">성균관대학교 · 중국어 무역 과목</div>
    </div>
    <div style="font-size:12px;color:#ccc">유형1·2·3 통합</div>
  </div>
  <div class="main-tabs">
    <button class="main-tab active" onclick="switchMain(1)">유형 1<br><span style="font-size:11px;opacity:.7">빈칸 채우기</span></button>
    <button class="main-tab" onclick="switchMain(2)">유형 2<br><span style="font-size:11px;opacity:.7">표현 해석</span></button>
    <button class="main-tab" onclick="switchMain(3)">유형 3<br><span style="font-size:11px;opacity:.7">문장 해석</span></button>
  </div>
  <div id="panel1" class="panel active"></div>
  <div id="panel2" class="panel"></div>
  <div id="panel3" class="panel"></div>
</div>

<script>
/* ── 유틸 ── */
function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function h(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function switchMain(n){
  document.querySelectorAll('.main-tab').forEach((t,i)=>t.classList.toggle('active',i===n-1));
  document.querySelectorAll('.panel').forEach((p,i)=>p.classList.toggle('active',i===n-1));
}

/* ══════════════════════════════════════
   유형 1 데이터
══════════════════════════════════════ */
const Q1=[
  {cat:"해상보험",s:"보험사고 발생으로 생긴 경제적 피해를 ___(損失)라고 한다.",a:"손해",o:["손해","담보","위험","보험료"]},
  {cat:"해상보험",s:"보험자가 보상을 약속한 보장 내용 또는 범위를 ___(承保)라고 한다.",a:"담보",o:["담보","손해","면책위험","보험가액"]},
  {cat:"해상보험",s:"담보의 원인이 되는 위험을 ___(承保风险), 보험자가 보상 책임을 면제받는 위험을 ___(除外风险)이라 한다.",a:"담보위험 / 면책위험",o:["담보위험 / 면책위험","면책위험 / 담보위험","보험료 / 보험금","보험금액 / 보험가액"]},
  {cat:"해상보험",s:"전쟁·파업·폭동·소요 등은 ___이지만, 특약으로 가입하면 담보된다.",a:"면책위험(除外风险)",o:["면책위험(除外风险)","담보위험(承保风险)","손해(损失)","위험(风险)"]},
  {cat:"해상보험",s:"보험계약의 당사자는 ___(保险人), ___(投保人), ___(被保险人)이다.",a:"보험자 / 보험계약자 / 피보험자",o:["보험자 / 보험계약자 / 피보험자","보험계약자 / 보험자 / 피보험자","피보험자 / 보험자 / 보험계약자","보험자 / 피보험자 / 보험계약자"]},
  {cat:"해상보험",s:"보험자의 위험 인수에 대해 보험계약자가 지급하는 대가를 ___(保险费)라 한다.",a:"보험료",o:["보험료","보험금","보험금액","보험가액"]},
  {cat:"해상보험",s:"보험사고 발생으로 피보험자가 보험자로부터 보상받는 손해보상액을 ___(保险金)이라 한다.",a:"보험금",o:["보험금","보험료","보험금액","보험가액"]},
  {cat:"해상보험",s:"보험가입금액으로 사고발생 시 보험자가 보상하는 최고 한도액을 ___(保险金额)이라 한다.",a:"보험금액",o:["보험금액","보험가액","보험금","보험료"]},
  {cat:"해상보험",s:"보험가입 가능한 최대 금액으로 피보험목적물의 평가액과 같은 것을 ___(保险价值)이라 한다.",a:"보험가액",o:["보험가액","보험금액","보험료","보험금"]},
  {cat:"해상보험",s:"화물이 무사히 도착했을 때 기대할 수 있는 예상이익을 ___(预期利润)이라 하며, 보통 송장금액의 110%를 부보한다.",a:"희망이익",o:["희망이익","보험가액","보험금액","담보위험"]},
  {cat:"협회적하약관",s:"ICC(A)는 구약관의 ___(一切险), ICC(B)는 ___(水渍险), ICC(C)는 ___(平安险)에 해당한다.",a:"전위험담보(A/R) / 분손담보(WA) / 분손부담보(FPA)",o:["전위험담보(A/R) / 분손담보(WA) / 분손부담보(FPA)","분손담보(WA) / 전위험담보(A/R) / 분손부담보(FPA)","분손부담보(FPA) / 분손담보(WA) / 전위험담보(A/R)","전위험담보(A/R) / 분손부담보(FPA) / 분손담보(WA)"]},
  {cat:"협회적하약관",s:"무고장선하증권(清洁提单)은 비고란에 ___가 없는 선하증권이다.",a:"사고 문구",o:["사고 문구","운임 기재","배서 기재","수하인 기재"]},
  {cat:"무역운송",s:"화주로부터 화물을 인수해 수하인에게 인도할 때까지 일체 업무를 주선하는 운송 주체를 ___(货运代理)라 한다.",a:"포워더(forwarder)",o:["포워더(forwarder)","선박회사","보험회사","통관업자"]},
  {cat:"무역운송",s:"선사가 운송계약한 송하인에게 발행하는 선하증권을 ___, 포워더가 개별 화주에게 발행하는 것을 ___이라 한다.",a:"마스터 B/L(船东提单) / 하우스 B/L(货代提单)",o:["마스터 B/L(船东提单) / 하우스 B/L(货代提单)","하우스 B/L / 마스터 B/L","기명식 B/L / 지시식 B/L","서렌더 B/L / 수취 B/L"]},
  {cat:"무역운송",s:"특정 수하인의 명칭이 기재되어 제3자에게 양도되지 않는 B/L을 ___(记名提单), 배서에 의해 양도 가능한 것을 ___(指示提单)이라 한다.",a:"기명식 B/L / 지시식 B/L",o:["기명식 B/L / 지시식 B/L","마스터 B/L / 하우스 B/L","서렌더 B/L / 수취 B/L","선적 B/L / 수취 B/L"]},
  {cat:"무역운송",s:"컨테이너를 가득 채운 만재화물을 ___(整箱货), 일부만 채운 소량화물을 ___(拼箱货)이라 한다.",a:"FCL화물 / LCL화물",o:["FCL화물 / LCL화물","LCL화물 / FCL화물","벌크화물 / 컨테이너화물","산적화물 / 포장화물"]},
  {cat:"무역운송",s:"신용장 거래 시 과부족용인 조항이 없어도 ___까지, 있다면 ___까지 용인된다.(UCP600 제30조)",a:"±5% / ±10%",o:["±5% / ±10%","±10% / ±5%","±3% / ±5%","±5% / ±15%"]},
  {cat:"무역운송",s:"물품을 여러 번 나누어 적재하는 것을 ___(分批装运), 운송 중 다른 선박으로 옮겨 싣는 것을 ___(转运)이라 한다.",a:"분할선적 / 환적",o:["분할선적 / 환적","환적 / 분할선적","직항선적 / 환적","분할선적 / 직항선적"]},
  {cat:"구매주문서",s:"어떤 절차나 행위를 거치면 바로 효력이 발생함을 나타내는 표현은 ___ 구문이다.",a:"一经~就/便",o:["一经~就/便","以免","以防","万一"]},
  {cat:"구매주문서",s:"'A하지 않도록'의 의미로 목적·예방을 나타내는 접속사는 ___이다.",a:"以免(yǐmiǎn)",o:["以免(yǐmiǎn)","以防(yǐfáng)","万一(wànyī)","造成(zàochéng)"]},
  {cat:"구매주문서",s:"각기 자기의 의견을 주장하고 양보하지 않음을 뜻하는 성어는 ___(gè zhí yì cí)이다.",a:"各执一词",o:["各执一词","以免","折算","造成"]},
  {cat:"구매주문서",s:"환율을 뜻하는 중국어는 ___, 환산하다는 ___이다.",a:"兑换率 / 折算",o:["兑换率 / 折算","折算 / 兑换率","造成 / 兑换率","装运指示 / 折算"]},
  {cat:"구매주문서",s:"녹슬다는 ___, 방청지는 ___, 에어캡(뽁뽁이)은 ___이다.",a:"生锈 / 油纸 / 气泡垫",o:["生锈 / 油纸 / 气泡垫","油纸 / 生锈 / 气泡垫","气泡垫 / 油纸 / 生锈","生锈 / 气泡垫 / 油纸"]},

  {cat:"주문확인서",s:"'~하면 바로 알리다·고지하다'의 의미로 쓰이는 표현은 ___ 구문이다.",a:"一经~即告~",o:["一经~即告~","一经~就/便","以免","如蒙"]},
  {cat:"주문확인서",s:"편지·문서 등을 확인하고 받다의 의미인 동사는 ___(cháshōu)이다.",a:"查收",o:["查收","留存","惠顾","凡是"]},
  {cat:"주문확인서",s:"방문해 주시다, 주문해 주시다의 뜻으로 쓰이는 동사는 ___(huìgù)이다.",a:"惠顾",o:["惠顾","查收","留存","函悉"]},
  {cat:"주문확인서",s:"어떠한 ~라도 모두의 의미를 가진 대명사는 ___(rènhé)이다.",a:"任何",o:["任何","凡是","无论","虽然"]},
  {cat:"주문확인서",s:"무릇, 모든의 의미로 '___+명사, ~均'의 형식으로 쓰이는 부사는?",a:"凡是",o:["凡是","任何","无论","虽然"]},

  {cat:"선적통지",s:"(주문·계약을) 확정하다는 ___(dìngtuǒ), 마음을 놓다·안심하다는 ___(shìniàn)이다.",a:"订妥 / 释念",o:["订妥 / 释念","释念 / 订妥","承运 / 提货","查收 / 惠顾"]},

  {c:"盼候你们的信用证；一俟收到将立即安排装运不误；特此函复。",k:"귀사의 신용장을 기다리고 있습니다; 수령하자마자 선적을 배정하여 차질이 없도록 하겠습니다. 이에 회신드립니다.",cat:"신용장"},

  {c:"由于最早驶往贵方港口的成功号货轮，舱位已满，所以我方无法将全部货物一次装运交货。",k:"귀사측 항구로 운행하는 가장 이른 화물선 '성공'호가 만선이기 때문에 당사는 전체 화물을 한 번에 선적하여 화물을 인도할 수 없습니다.",cat:"신용장"},
  {c:"由于这是事先没有预料到的，我们特此请求贵方修改信用证，将特别条款不允许分批装运删除或者改成允许分批装运。",k:"이는 사전에 예상하지 못했기 때문에 당사는 신용장을 수정해주시기를 요청 드립니다. 특별조항 '분할선적 불허'를 삭제하시거나 '분할선적 허용'으로 수정해주실 것을 요청 드립니다.",cat:"신용장"},
  {c:"根据中国银行所开具的信用证，我们已经开出以该银行为付款人，见票后30天付款的汇票，金额4,000,000元，望该汇票一经提示，即予承兑。",k:"중국은행에서 개설한 신용장에 근거하여 해당 은행을 지급인으로 하고 일람후 30일 지급 환어음(액면 금액 400만 위안)을 발행했습니다. 해당 환어음이 제시되면 바로 인수 부탁드립니다.",cat:"신용장"},
  {c:"买卖合同签订以后，按照合同规定的时间、地点和方式，将货物运交买方或买方代理人或指定的承运工具，这是卖方承担的首要任务。",k:"매매계약 체결이후 계약서에서 규정한 시간, 장소, 방식에 따라 화물을 매수인, 또는 매수 대리인 또는 매수인이 지정한 운송수단에 인도하는 것이 매도인이 담당하는 가장 중요한 임무입니다.",cat:"선적통지"},
  {c:"货物装载完毕并取得提单后，一般应发出装运通知，以便买方了解装运情况并进行收货前的准备。",k:"화물 선적이 완료되고 선하증권을 취득한 후에 일반적으로 선적통지를 발송함으로써 매수인이 선적상황을 파악하고 화물 수령 전의 준비를 진행할 수 있도록 한다.",cat:"선적통지"},
  {c:"这类书信通常还附寄有关文件，以便买方提货。",k:"선적 통지 서신은 매수인이 화물을 인수할 수 있도록 보통 관련 서류를 첨부한다.",cat:"선적통지"},
  {c:"买方收到信后应尽快将提货情况通知卖方，并完成付款手续。",k:"매수인은 서신을 수령한 후에 화물을 인수받은 상황을 최대한 빨리 매도인에게 통지하고 지급 수속을 청산해야 한다.",cat:"선적통지"},
  {c:"我方迟迟通知的原因是从此地驶往你方港口的直达船十分稀少，殊难租到舱位。",k:"당사가 늦게 통지한 이유는 여기에서 귀측 항구로 운행하는 직항 노선이 매우 드물어 선복을 확보하기 매우 어렵기 때문입니다.",cat:"선적통지"},
  {c:"一俟舱位订妥，当以电邮通知贵方确切装运日期。",k:"선복이 확보되면 즉시 귀사에게 메일로 확실한 선적 일자를 통지하겠습니다.",cat:"선적통지"},
];

/* ══════════════════════════════════════
   유형 1 로직
══════════════════════════════════════ */
let s1={order:[],idx:0,sel:null,conf:false,score:0,done:false,opts:[]};

function initType1(){
  s1.order=shuf(Q1.map((_,i)=>i));
  s1.idx=0;s1.sel=null;s1.conf=false;s1.score=0;s1.done=false;
  s1.opts=shuf(Q1[s1.order[0]].o);
  renderType1();
}

function renderType1(){
  const el=document.getElementById('panel1');
  if(s1.done){
    const p=Math.round(s1.score/Q1.length*100);
    const c=p>=90?"완벽해요! 🎉":p>=70?"잘 하고 있어요 👍":p>=50?"조금 더 연습해봐요 💪":"다시 복습해봐요 📖";
    el.innerHTML=`<div class="card done-wrap">
      <div class="score-big" style="color:${p>=70?'#16a34a':'#dc2626'}">${s1.score} / ${Q1.length}</div>
      <div class="score-lbl">${p}점 · ${c}</div>
      <div class="btn-row" style="justify-content:center">
        <button class="btn btn-p" onclick="initType1()">처음부터</button>
        <button class="btn btn-ghost" onclick="s1.order=shuf(Q1.map((_,i)=>i));s1.idx=0;s1.sel=null;s1.conf=false;s1.score=0;s1.done=false;s1.opts=shuf(Q1[s1.order[0]].o);renderType1()">랜덤으로 다시</button>
      </div></div>`;
    return;
  }
  const q=Q1[s1.order[s1.idx]];
  const pct=Math.round((s1.idx+1)/Q1.length*100);
  const blanked=q.s.split('___').map((part,i,arr)=>{
    if(i===arr.length-1)return h(part);
    const val=s1.conf?h(q.a):(s1.sel?h(s1.sel):'　　　');
    return h(part)+`<span class="blank">${val}</span>`;
  }).join('');
  const optsHtml=s1.opts.map(o=>{
    let cls='opt';
    if(s1.conf){
      if(o===q.a)cls='opt ok';
      else if(o===s1.sel&&o!==q.a)cls='opt ng';
      else cls='opt dim';
    } else if(o===s1.sel) cls='opt sel';
    return `<button class="${cls}" onclick="pickOpt1('${h(o)}')">${h(o)}</button>`;
  }).join('');
  const fb=s1.conf?`<div class="fb ${s1.sel===q.a?'fb-ok':'fb-ng'}">${s1.sel===q.a?'✓ 정답입니다!':'✗ 오답&nbsp;&nbsp;정답: '+h(q.a)}</div>`:'';
  const btnConf=!s1.conf?`<button class="btn btn-p" onclick="confType1()" style="opacity:${s1.sel?1:0.35}">정답 확인</button>`:'';
  const btnNext=s1.conf?`<button class="btn btn-b" onclick="nextType1()">${s1.idx+1>=Q1.length?'결과 보기 →':'다음 문제 →'}</button>`:'';
  el.innerHTML=`
    <div class="prog-row">
      <div class="prog-bar"><div class="prog-fill fill1" style="width:${pct}%"></div></div>
      <span class="prog-text">${s1.idx+1} / ${Q1.length}</span>
    </div>
    <div class="card">
      <div class="row-top">
        <span class="label-sm">빈칸에 알맞은 용어를 보기에서 고르시오</span>
        <span class="badge b1">${h(q.cat)}</span>
      </div>
      <div class="sbox sb1">${blanked}</div>
      <div class="opts-label">〔보기〕</div>
      <div class="opts">${optsHtml}</div>
      ${fb}
      <div class="btn-row">
        ${btnConf}${btnNext}
        <button class="btn btn-ghost" style="margin-left:auto" onclick="s1.order=shuf(Q1.map((_,i)=>i));s1.idx=0;s1.sel=null;s1.conf=false;s1.score=0;s1.done=false;s1.opts=shuf(Q1[s1.order[0]].o);renderType1()">랜덤 섞기</button>
      </div>
    </div>`;
}

function pickOpt1(o){if(s1.conf)return;s1.sel=o;renderType1();}
function confType1(){if(!s1.sel||s1.conf)return;s1.conf=true;if(s1.sel===Q1[s1.order[s1.idx]].a)s1.score++;renderType1();}
function nextType1(){
  s1.idx++;
  if(s1.idx>=Q1.length){s1.done=true;renderType1();return;}
  s1.sel=null;s1.conf=false;s1.opts=shuf(Q1[s1.order[s1.idx]].o);renderType1();
}

/* ══════════════════════════════════════
   유형 2 로직
══════════════════════════════════════ */
let s2={order:[],idx:0,input:'',shown:false,done:false};

function initType2(){
  s2.order=shuf(Q2.map((_,i)=>i));
  s2.idx=0;s2.input='';s2.shown=false;s2.done=false;
  renderType2();
}

function renderType2(){
  const el=document.getElementById('panel2');
  if(s2.done){
    el.innerHTML=`<div class="card done-wrap">
      <div class="score-big" style="color:#16a34a">${Q2.length} 완료 🎉</div>
      <div class="score-lbl">전체 문제를 풀었어요. 수고하셨어요!</div>
      <div class="btn-row" style="justify-content:center">
        <button class="btn btn-g" onclick="initType2()">처음부터</button>
        <button class="btn btn-ghost" onclick="s2.order=shuf(Q2.map((_,i)=>i));s2.idx=0;s2.input='';s2.shown=false;s2.done=false;renderType2()">랜덤으로 다시</button>
      </div></div>`;
    return;
  }
  const q=Q2[s2.order[s2.idx]];
  const pct=Math.round((s2.idx+1)/Q2.length*100);
  const clean=q.f.replace('～','');
  const hi=q.s.includes(clean)?q.s.replace(clean,`<u style="font-weight:700;color:#15803d;text-decoration-color:#15803d;text-underline-offset:3px">${h(clean)}</u>`):h(q.s);
  const fb=s2.shown?`<div class="fb fb-info"><div style="font-weight:700;margin-bottom:5px;color:#1d4ed8">✓ 정답: ${h(q.a)}</div><div style="font-size:13px;line-height:1.7">${h(q.e)}</div></div>`:'';
  const btnCheck=!s2.shown?`<button class="btn btn-g" onclick="checkType2()">정답 확인</button>`:'';
  const btnNext=s2.shown?`<button class="btn btn-b" onclick="nextType2()">${s2.idx+1>=Q2.length?'결과 보기 →':'다음 문제 →'}</button>`:'';
  el.innerHTML=`
    <div class="prog-row">
      <div class="prog-bar"><div class="prog-fill fill2" style="width:${pct}%"></div></div>
      <span class="prog-text">${s2.idx+1} / ${Q2.length}</span>
    </div>
    <div class="card">
      <div class="row-top">
        <span class="label-sm">문맥에 맞게 밑줄 친 표현을 해석하시오</span>
        <span class="badge b2">${h(q.cat)}</span>
      </div>
      <div class="sbox sb2">${hi}</div>
      <div class="focus-lbl">→ 밑줄 친 「<strong style="color:#15803d">${h(q.f)}</strong>」의 뜻을 쓰시오</div>
      <textarea id="ta2" ${s2.shown?'disabled':''} placeholder="한국어로 뜻을 적어주세요...">${h(s2.input)}</textarea>
      ${fb}
      <div class="btn-row">
        ${btnCheck}${btnNext}
        <button class="btn btn-ghost" style="margin-left:auto" onclick="s2.order=shuf(Q2.map((_,i)=>i));s2.idx=0;s2.input='';s2.shown=false;s2.done=false;renderType2()">랜덤 섞기</button>
      </div>
    </div>`;
  const ta=document.getElementById('ta2');
  if(ta&&!s2.shown)ta.oninput=e=>{s2.input=e.target.value;};
}

function checkType2(){s2.shown=true;renderType2();}
function nextType2(){
  s2.idx++;
  if(s2.idx>=Q2.length){s2.done=true;renderType2();return;}
  s2.input='';s2.shown=false;renderType2();
}

/* ══════════════════════════════════════
   유형 3 로직
══════════════════════════════════════ */
const CATS3=['전체',...[...new Set(Q3.map(q=>q.cat))]];
let s3={cat:'전체',order:[],idx:0,input:'',shown:false,done:false};

function initType3(){
  s3.cat='전체';
  s3.order=shuf(Q3.map((_,i)=>i));
  s3.idx=0;s3.input='';s3.shown=false;s3.done=false;
  renderType3();
}

function changeCat3(c){
  s3.cat=c;
  const idxs=Q3.map((_,i)=>i).filter(i=>c==='전체'||Q3[i].cat===c);
  s3.order=shuf(idxs);s3.idx=0;s3.input='';s3.shown=false;s3.done=false;
  renderType3();
}

function renderType3(){
  const el=document.getElementById('panel3');
  const catTabsHtml=CATS3.map(c=>`<button class="cat-tab${s3.cat===c?' on':''}" onclick="changeCat3('${c}')">${c}</button>`).join('');
  if(s3.done){
    el.innerHTML=`<div class="cat-tabs">${catTabsHtml}</div>
    <div class="card done-wrap">
      <div class="score-big" style="color:#ea580c">${s3.order.length} 완료 🎉</div>
      <div class="score-lbl">수고하셨어요!</div>
      <div class="btn-row" style="justify-content:center">
        <button class="btn btn-o" onclick="changeCat3(s3.cat)">처음부터</button>
        <button class="btn btn-ghost" onclick="changeCat3(s3.cat)">랜덤으로 다시</button>
      </div></div>`;
    return;
  }
  const total=s3.order.length;
  const q=Q3[s3.order[s3.idx]];
  const pct=Math.round((s3.idx+1)/total*100);
  const fb=s3.shown?`<div class="fb fb-info"><span style="font-weight:700">모범 번역</span><br>${h(q.k)}</div>`:'';
  const btnCheck=!s3.shown?`<button class="btn btn-o" onclick="checkType3()">정답 확인</button>`:'';
  const btnNext=s3.shown?`<button class="btn btn-b" onclick="nextType3()">${s3.idx+1>=total?'결과 보기 →':'다음 문제 →'}</button>`:'';
  el.innerHTML=`
    <div class="cat-tabs">${catTabsHtml}</div>
    <div class="prog-row">
      <div class="prog-bar"><div class="prog-fill fill3" style="width:${pct}%"></div></div>
      <span class="prog-text">${s3.idx+1} / ${total}</span>
    </div>
    <div class="card">
      <div class="row-top">
        <span class="label-sm">중국어 문장을 한국어로 해석하시오</span>
        <span class="badge b3">${h(q.cat)}</span>
      </div>
      <div class="sbox sb3">${h(q.c)}</div>
      <textarea id="ta3" ${s3.shown?'disabled':''} placeholder="한국어로 해석을 적어주세요...">${h(s3.input)}</textarea>
      ${fb}
      <div class="btn-row">
        ${btnCheck}${btnNext}
        <button class="btn btn-ghost" style="margin-left:auto" onclick="changeCat3(s3.cat)">랜덤 섞기</button>
      </div>
    </div>`;
  const ta=document.getElementById('ta3');
  if(ta&&!s3.shown)ta.oninput=e=>{s3.input=e.target.value;};
}

function checkType3(){s3.shown=true;renderType3();}
function nextType3(){
  s3.idx++;
  if(s3.idx>=s3.order.length){s3.done=true;renderType3();return;}
  s3.input='';s3.shown=false;renderType3();
}

/* ── 초기화 ── */
initType1();
initType2();
initType3();
</script>
</body>
</html>
